# Builds the installers and portable ZIPs (64-bit and 32-bit) and publishes
# them as a GitHub Release whenever a version tag (v1.2.3) is pushed.
# The easiest way to trigger it: scripts\release.ps1 1.2.3
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build release files
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Run tests (with the bundled ffmpeg)
        run: cargo test --workspace

      - name: Build Windows 7 files
        shell: pwsh
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          ./scripts/package.ps1 -Win7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Zavyx VE ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Download
            - **ZavyxVE-Setup-*-x64.exe** — recommended for 64-bit Windows 10/11.
            - **ZavyxVE-Setup-*-x86.exe** — 32-bit build for older PCs.
            - **ZavyxVE-Setup-*-win7-x64.exe / -win7-x86.exe** — for Windows 7 (64-bit / 32-bit).
            - **ZavyxVE-*-portable.zip** — no install. Unzip and run `ZavyxVE.exe`.
          files: |
            dist/ZavyxVE-Setup-*.exe
            dist/ZavyxVE-*-portable.zip
