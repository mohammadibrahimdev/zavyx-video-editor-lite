[workspace]
resolver = "2"
members = [
    "crates/zavyx-ve-core",
    "crates/zavyx-ve-media",
    "crates/zavyx-ve-render",
    "crates/zavyx-ve-audio",
    "crates/zavyx-ve-ai",
    "crates/zavyx-ve-gui",
    "crates/zavyx-ve-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
authors = ["Mohammad Ibrahim <https://github.com/mohammadibrahimdev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mohammadibrahimdev/zavyx-video-editor-lite"
homepage = "https://github.com/mohammadibrahimdev/zavyx-video-editor-lite"
publish = false

[workspace.dependencies]
# Internal crates
zavyx-ve-core   = { path = "crates/zavyx-ve-core" }
zavyx-ve-media  = { path = "crates/zavyx-ve-media" }
zavyx-ve-render = { path = "crates/zavyx-ve-render" }
zavyx-ve-audio  = { path = "crates/zavyx-ve-audio" }
zavyx-ve-ai     = { path = "crates/zavyx-ve-ai" }

# Shared external crates — pinned to versions known to work on both
# x86_64-pc-windows-msvc and i686-pc-windows-msvc.
serde       = { version = "1.0",  features = ["derive"] }
serde_json  = { version = "1.0" }
num-rational = { version = "0.4", features = ["serde"] }
num-traits  = { version = "0.2" }
uuid        = { version = "1.10", features = ["v4", "serde"] }
anyhow      = { version = "1.0" }
thiserror   = { version = "1.0" }
parking_lot = { version = "0.12" }
crossbeam-channel = { version = "0.5" }
rayon       = { version = "1.10" }
log         = { version = "0.4" }
env_logger  = { version = "0.11" }
clap        = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
